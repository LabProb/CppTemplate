name: C++ CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt update
          sudo apt install -y clang-format

      - name: Check formatting
        run: make check-format

  build:
    name: Build (${{ matrix.compiler }})
    needs: format

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', '**/*.cpp', '**/*.hpp') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.compiler }}-
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            gcc \
            g++ \
            clang \
            clang-tidy \
            clang-format \
            cmake \
            ninja-build \
            ccache

      - name: Configure compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          else
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi

      - name: Configure ccache
        run: |
          ccache --max-size=500M
          ccache --zero-stats

      - name: Configure Debug
        run: cmake --preset debug

      - name: Build Debug
        run: cmake --build --preset debug

      - name: Run clang-tidy
        run: make tidy

      - name: Run tests
        run: make test

      - name: Configure Release
        run: cmake --preset release

      - name: Build Release
        run: cmake --build --preset release

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

  coverage:
    name: Coverage (GCC)

    needs: build

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            gcc \
            g++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip

          python3 -m pip install gcovr

      - name: Configure Coverage
        run: |
          cmake --preset coverage

      - name: Build Coverage
        run: |
          cmake --build --preset coverage

      - name: Run tests
        run: |
          ctest \
            --test-dir build/coverage \
            --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr \
            --root . \
            --filter src \
            --exclude tests \
            --exclude build \
            --exclude "src/main.cpp" \
            --html-details coverage.html \
            --xml coverage.xml \
            --print-summary

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.html
            coverage.xml

      - name: Upload coverage build files
        uses: actions/upload-artifact@v4
        with:
          name: coverage-build
          path: |
            build/coverage/compile_commands.json
